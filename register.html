<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TrekManager</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body{
            background:#f5f7fb;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card form-card mx-auto">
            {% if error %}
                <div class="alert alert-danger text-center w-100 mx-auto" role="alert" style="max-width: 420px; margin-bottom: 10px; border-radius: 10px;">
                    {{ error }}
                </div>
            {% endif %}
            <div class="card-body p-5">

                <div class="logo">
                    <i class="bi bi-person-fill"></i>
                </div>

                <h3 class="text-center fw-bold mb-2">Trekking Management Application</h3>
                <h4 class="text-center text-muted mb-4">
                    Register
                </h4>

                <form action="{{ url_for('auth.register') }}" method="post">
                    <div class="mb-3">
                        <label for="fname" class="form-label">Full Name</label>
                        <input type="text" id="fname" class="form-control" placeholder="Enter your email" name="fullname">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" name="email">
                    </div>

                    <div class="mb-3">
                        <label for="pass" class="form-label">Password</label>
                        <input type="password" id="pass" class="form-control" placeholder="Enter your password" name="password">
                    </div>
                    
                    <div class="mb-3">
                        <label for="cpass" class="form-label">Confirm Password</label>
                        <input type="password" id="cpass" class="form-control" placeholder="Enter your password" name="cpassword">
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label">You are</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="staff">Staff</option>
                            <option value="trekker">Trekker</option>
                        </select>
                    </div>

                    <button class="btn btn-success btn-form w-100">
                        Register
                    </button>

                </form>

                <hr class="my-4">

                <p class="text-center mb-0">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none">
                        Login
                    </a>
                </p>

            </div>
        </div>
    </div>
</body>
</html>
