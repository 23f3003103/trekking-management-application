<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Add/Edit Trek</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f5f7fa;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">   
        <ul class="nav-bar flex-column">

            <li class="nav-item">
                <a href="{{ url_for('auth.admin') }}" class="nav-link">
                    <i class="bi bi-grid-fill"></i>
                    Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a href="{{ url_for('auth.admin_trek') }}" class="nav-link active">
                    <i class="bi bi-map"></i>
                    Treks
                </a>
            </li>

            <li class="nav-item">
                <a href="{{ url_for('auth.admin_manage_staff') }}" class="nav-link">
                    <i class="bi bi-people"></i>
                    Manage Staff
                </a>
            </li>

            <li class="nav-item">
                <a href="{{ url_for('auth.admin_manage_trekker') }}" class="nav-link">
                    <i class="bi bi-people"></i>
                    Manage Trekker
                </a>
            </li>

            <li class="nav-item">
                <a href="{{ url_for('auth.admin_manage_booking') }}" class="nav-link">
                    <i class="bi bi-calendar-check"></i>
                    Bookings
                </a>
            </li>

            <!-- <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="bi bi-gear"></i>
                    Settings
                </a>
            </li> -->

        </ul>

        <div class="logout">
            <a href="#" class="nav-link">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>
        </div>
    </aside>

    <main class="main-content">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <div class="d-flex align-items-center gap-2">
                <h1 class="h4 mb-0 fw-bold d-none d-sm-block">TrekManager</h1>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="#">
                    <button type="button" class="btn btn-outline-primary">Back</button>
                </a>
                <!-- Profile Dropdown -->
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center gap-2 text-decoration-none text-dark" data-bs-toggle="dropdown">
                        <img src="/static/images/humanicon.png" alt="Admin" class="rounded-circle border border-primary-light" style="width: 36px; height: 36px; object-fit: cover;">
                        <i class="bi bi-chevron-down d-none d-sm-block text-muted small"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="/"><i class="bi bi-box-arrow-left me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- Dashboard Content Body -->
        <div class="content-body">
            <div style="margin-bottom: 30px;">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h2 class="fw-bold mb-1">Add New Trek</h2>
                    </div>
                </div>
            </div>
            
            </div>
            <!-- Add Trek -->
            <div class="main-table">
            <div class="form">
            <form action="{{ url_for('auth.admin_add_trek') }}" method="post">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label" for="trekName">Trek Name</label>
                            <input type="text" class="form-control" id="trekName" name="trekname">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="location">Location</label>
                            <input type="text" class="form-control" id="location" name="location">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="difficulty">Difficulty</label>
                            <select class="form-select" id="difficulty" name="difficulty">
                                <option selected>Select</option>
                                <option>Easy</option>
                                <option>Moderate</option>
                                <option>Hard</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="duration">Duration (Days)</label>
                            <input type="number" class="form-control" id="duration" name="duration">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="availableSlots">Available Slots</label>
                            <input type="number" class="form-control" id="availableSlots" name="slots">
                        </div>

                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label" for="startDate">Start Date</label>
                            <input type="date" class="form-control" id="startDate" name="sdate">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="endDate">End Date</label>
                            <input type="date" class="form-control" id="endDate" name="edate">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="trekstaff">Trek Staff</label>
                            <select class="form-select" id="trekstaff" name="staff_id">
                                <option selected value="">Select option</option>
                                {% for staff in staff_list %}
                                <option value="{{ staff.id }}">{{ staff.user.fullname }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="status">Status</label>
                            <select class="form-select" id="status" name="status">
                                <option selected>Select Status</option>
                                <option>Upcoming</option>
                                <option>Completed</option>
                                <option>Cancelled</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="description">Description</label>
                            <textarea class="form-control" id="description" rows="3" name="des"></textarea>
                        </div>

                    </div>
                </div>
                <div class="text-end">
                    <button type="reset" class="btn btn-secondary">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>
                </div>
            </form>
            </div>
            </div>
        </div>
    </main>
</body>
</html>
