<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f5f7fa;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <!-- Sidebar -->

                <a href="/templates/admin/admin_manage_trek.html" class="nav-link active">
                    <i class="bi bi-map"></i>
                    Treks
                </a>
            </li>

            <li class="nav-item">
                <a href="/templates/admin/admin_manage_staff.html" class="nav-link">
                    <i class="bi bi-people"></i>
                    Manage Staff
                </a>
            </li>

            <li class="nav-item">
                <a href="/templates/admin/admin_manage_users.html" class="nav-link">
                    <i class="bi bi-people"></i>
                    Manage Users
                </a>
            </li>

            <li class="nav-item">
                <a href="/templates/admin/admin_bookings.html" class="nav-link">

            <!-- <li class="nav-item">
                <a href="#" class="nav-link">

            </li> -->

        </ul>

        <div class="logout">
            <a href="#" class="nav-link">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>
        </div>
    </aside>

    <main class="main-content">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <div class="d-flex align-items-center gap-2">
                <h1 class="h4 mb-0 fw-bold d-none d-sm-block">TrekManager</h1>
            </div>
            <div class="d-flex align-items-center gap-3">
                

                <!-- Profile Dropdown -->
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center gap-2 text-decoration-none text-dark" data-bs-toggle="dropdown">
                        <img src="/static/images/humanicon.png" alt="Admin" class="rounded-circle border border-primary-light" style="width: 36px; height: 36px; object-fit: cover;">
                        <i class="bi bi-chevron-down d-none d-sm-block text-muted small"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="index.html"><i class="bi bi-box-arrow-left me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- Dashboard Content Body -->
        <div class="content-body">
            <div style="margin-bottom: 30px;">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h2 class="fw-bold mb-1">Add New Trek</h2>
                    </div>
                </div>
            </div>
            
            </div>
            <!-- Add Trek -->
             <div class="form">
            <form>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Trek Name</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Difficulty</label>
                            <select class="form-select">
                                <option selected>Select</option>
                                <option>Easy</option>
                                <option>Moderate</option>
                                <option>Hard</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Duration (Days)</label>
                            <input type="number" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Available Slots</label>
                            <input type="number" class="form-control">
                        </div>

                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Activity Status</label>
                            <select class="form-select">
                                <option selected>Select Status</option>
                                <option>Active</option>
                                <option>Inactive</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select">
                                <option selected>Select Status</option>
                                <option>Upcoming</option>
                                <option>Completed</option>
                                <option>Cancelled</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>

                    </div>
                </div>
                <div class="text-end">
                    <button type="reset" class="btn btn-secondary">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>
                </div>
            </form>
            </div>
            
        </div>
    </main>
</body>
</html>
